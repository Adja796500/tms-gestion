<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f3864">
    <title>Hors connexion</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: linear-gradient(160deg, #1f3864, #4338ca); color: #fff; padding: 24px; box-sizing: border-box; }
        .carte { max-width: 420px; text-align: center; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 20px; padding: 32px 28px; }
        .logo { display: inline-block; background: #fff; border-radius: 16px; padding: 10px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
        .logo img { height: 56px; display: block; }
        h1 { font-size: 22px; margin: 18px 0 8px; }
        p { color: rgba(255,255,255,.8); line-height: 1.5; margin: 0 0 22px; }
        button { background: #10b981; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="carte">
        <span class="logo"><img src="/images/logo.png" alt="Rob Teegwende Multi-Services"></span>
        <h1>Pas de connexion internet</h1>
        <p>Cette page n'a pas encore été consultée hors connexion. Vérifiez votre réseau (données mobiles ou Wi-Fi) puis réessayez. Les pages déjà ouvertes restent consultables.</p>
        <button onclick="location.reload()">Réessayer</button>
    </div>
    <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
