# Deploiement sur Render (offre gratuite) : un site web Docker + une base PostgreSQL.
# Sur render.com : New + > Blueprint > choisir ce depot. Render lit ce fichier.
services:
  - type: web
    name: tms-gestion
    runtime: docker
    plan: free
    branch: production
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: TMS Gestion
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false          # a coller lors de la creation (voir docs/mise-en-ligne-render.md)
      - key: APP_LOCALE
        value: fr
      - key: APP_CURRENCY
        value: FCFA
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: tms-gestion-db
          property: connectionString
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: log

databases:
  - name: tms-gestion-db
    plan: free
    databaseName: tms_gestion
